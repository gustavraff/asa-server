name: Validate web manager

on:
  pull_request:
    paths:
      - "web-manager/**"
      - "!web-manager/node_modules/**"
  push:
    branches: [main]
    paths:
      - "web-manager/**"
  workflow_dispatch: {}

concurrency:
  group: validate-web-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-manager
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: "npm"
          cache-dependency-path: web-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
